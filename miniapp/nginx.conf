server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # HTML: no-cache — браузер проверяет актуальность через ETag/Last-Modified
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # Хэшированные ассеты (Vite: index-<hash>.css/.js) — кэш навсегда
    location ~ \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
    }

    # API proxy - use environment variable for target
    location ~ ^/(auth|users|translate|chats|stats|billing)(/|$) {
        proxy_pass ${API_TARGET};
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA fallback — всё остальное отдаём index.html с no-cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

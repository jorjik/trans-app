# Default config for the bot service (deploy bot first from repo root).
# For api / miniapp, set Config File in Railway to railway.api.toml or railway.miniapp.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.bot"
watchPatterns = ["bot/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
